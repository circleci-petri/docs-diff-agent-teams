# ---------------------------------------------------------------------------
# CI-FIRST WORKFLOW
# ---------------------------------------------------------------------------
ci_first_workflow:
  principle: "Pipeline created BEFORE feature code. All work validated by CI."
  pipeline_order:
    - "pnpm typecheck"
    - "pnpm lint"
    - "pnpm build"
    - "pnpm test:ci"
  rules:
    - "Before starting any track: check CI status. If RED, fix first."
    - "After completing each task: run pnpm ci:check locally, push, verify GREEN."
    - "CI failure = P0: fix within 30 minutes."
    - "Never implement new features while CI is RED."
    - "Document CI fixes in commit messages."
