# OpenSpec 1.0 — docs-screenshot-diff
# Version: v1 — 2026-02-07
# Parent: CIR-481 | Ticket: CIR-483
# Depends on: CIR-482 (HumanSpec v1 — finalized)

openspec: "1.0"

project:
  name: "docs-screenshot-diff"
  description: >
    CLI tool that monitors circleci.com/docs/ for visual changes by comparing
    current screenshots against baselines, generating reports of which pages
    need updated documentation screenshots.
  type: "cli-tool"
  repo: "docs-diff-agent-teams"
  context: >
    CircleCI's first visual regression tool. Part of Guayaba AI SDLC velocity
    evaluation. Demo target: internal leadership (JP, Mitch, Webster, Rob).
    Philosophy: exploration over execution — learning vehicle for AI-assisted
    development. Repo is docs-diff-agent-teams (agent teams experiment),
    NOT the PRD's circleci-petri/docs-screenshot-diff.

# ---------------------------------------------------------------------------
# GOALS — mapped from PRD Success Criteria
# ---------------------------------------------------------------------------
goals:
  - id: G1
    description: "Capture baseline screenshots of product website pages at consistent 1440x900 resolution"
  - id: G2
    description: "Compare current product UI against baseline images using pixelmatch with configurable threshold"
  - id: G3
    description: "Generate markdown report identifying which pages visually changed so docs team knows what to update"
  - id: G4
    description: "Generate diff images that visually highlight what changed (red/magenta pixels)"
  - id: G5
    description: "Support authentication for protected product websites via configurable Playwright login flow (Phase 3 — deferred)"
  - id: G6
    description: "Run reliably on macOS (primary), Linux, and Windows"
  - id: G7
    description: "Demonstrate full AI SDLC flow for Guayaba velocity evaluation — process learning matters as much as output"

# ---------------------------------------------------------------------------
# CONSTRAINTS
# ---------------------------------------------------------------------------
constraints:
  - "Runtime: Node.js 18+"
  - "Language: TypeScript strict mode"
  - "Package manager: pnpm (not npm/yarn)"
  - "Linter: oxlint (CircleCI standard since Oct 2025, migrated from ESLint)"
  - "Formatter: oxc formatter"
  - "Test runner: vitest"
  - "Browser: Playwright (Chromium headless)"
  - "Image diff: pixelmatch + pngjs"
  - "CLI: Commander.js"
  - "CI-first: pipeline created BEFORE feature code, all work validated by CI"
  - "CI pipeline order: typecheck -> lint -> build -> test"
  - "NEVER commit secrets to git (zero-tolerance — Jan 2026 incident at CircleCI)"
  - "NEVER use pre-commit hooks (CircleCI policy — 'attack vector')"
  - "NEVER include GPL-only dependencies (Wiz scans flag; multi-license OK if permissive option)"
  - "NEVER implement new features while CI is RED"
  - "No paid APIs or third-party SaaS without security review"
  - "No auth needed for v1 — target is public circleci.com/docs/"
  - "CI-based enforcement preferred over local tooling"
  - "Ship-and-iterate culture — CI is the quality gate"
  - "screenshots/baseline/ committed to git; screenshots/current/ and screenshots/diff/ gitignored"
  - "Support ENV:VAR_NAME syntax for secrets in config"

# ---------------------------------------------------------------------------
# BDD USER SCENARIOS
# ---------------------------------------------------------------------------
scenarios:
  - id: S1
    name: "Capture Baseline"
    persona: "docs team member"
    goal: "capture baseline screenshots of circleci.com/docs/ pages for future comparisons"
    given: "a config.json with pages listed"
    when: "I run `capture`"
    then: "PNG screenshots are saved to screenshots/baseline/{name}.png"
    goals: [G1]

  - id: S2
    name: "Detect Visual Changes"
    persona: "docs team member"
    goal: "compare current state of product pages against baselines to know which docs screenshots are stale"
    given: "baselines exist"
    when: "I run `compare`"
    then: "changed pages (>5% diff) generate diff images and appear in a markdown report"
    goals: [G2, G3, G4]

  - id: S3
    name: "Review Diff Report"
    persona: "docs team member"
    goal: "see a clear markdown report to prioritize which screenshots to update"
    given: "comparison is complete"
    when: "I open report.md"
    then: "I see summary counts, changed pages with diff %, and embedded diff images"
    goals: [G3]

  - id: S4
    name: "Missing Baseline Handling"
    persona: "docs team member"
    goal: "graceful handling when baselines don't exist so the tool doesn't crash"
    given: "a page has no baseline"
    when: "I run `compare`"
    then: "it's listed as 'missing baseline' in the report and comparison is skipped"
    goals: [G2, G3]

  - id: S5
    name: "Authentication (Phase 3 — deferred)"
    persona: "docs team member"
    goal: "authenticate against protected product pages to screenshot logged-in UI"
    deferred: true
    goals: [G5]

